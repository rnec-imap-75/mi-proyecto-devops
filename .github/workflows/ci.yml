name: Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1 — Checkout del código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2 — Instalación de dependencias
      - name: Instalación de dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3 — Ejecución de tests automáticos
      - name: Ejecución de tests automáticos
        run: |
          python -m pytest tests/ -v

      # 4 — Build de la imagen Docker
      - name: Build de la imagen Docker
        run: |
          docker build -t mi-app-devops:${{ github.sha }} .

      # 5 — Escaneo de seguridad con Trivy
      - name: Escaneo de seguridad con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-devops:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
